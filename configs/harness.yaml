sandbox:
  backend: local
  execution_timeout_seconds: 15
  max_output_chars: 8192
  docker_image: tabular-benchmark-sandbox:latest
  docker_network: none
  docker_cpus: 1
  docker_memory: 1g
  docker_pids_limit: 64
benchmark:
  numeric_atol: 1.0e-6
  numeric_rtol: 1.0e-5
  max_workers: 4
